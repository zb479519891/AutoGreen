name: Cleanup Daily Commit runs

on:
  schedule:
    - cron: "0 8 */5 * *"
  workflow_dispatch:

permissions:
  actions: write

concurrency:
  group: cleanup-daily-commit-runs
  cancel-in-progress: true

env:
  KEEP_RECENT: 10
  TARGET_WORKFLOW: Daily Commit

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Delete old Daily Commit runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          workflow_id="$(gh api \
            "repos/${{ github.repository }}/actions/workflows" \
            --paginate \
            --jq '.workflows[] | select(.name == env.TARGET_WORKFLOW) | .id' \
            | head -n 1)"

          if [ -z "$workflow_id" ]; then
            echo "Workflow '$TARGET_WORKFLOW' not found; nothing to clean."
            exit 0
          fi

          gh api \
            --paginate \
            "repos/${{ github.repository }}/actions/workflows/${workflow_id}/runs?per_page=100" \
            --jq '.workflow_runs[] | select(.status == "completed") | [.id, .created_at] | @tsv' \
            | sort -k2 -r \
            | tail -n +$((KEEP_RECENT + 1)) \
            | while IFS=$'\t' read -r run_id created_at; do
                [ -z "$run_id" ] && continue
                echo "Deleting workflow run $run_id ($created_at)"
                gh api -X DELETE \
                  "repos/${{ github.repository }}/actions/runs/$run_id"
              done
